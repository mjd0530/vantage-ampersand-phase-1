name: Windows app

on:
  push:
    branches:
      - 'cursor/**'
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The cake& dependency is a URL tarball with no committed lockfile, which
      # trips an arborist crash on the npm bundled with Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - run: npm run tauri:build

      # The installer is what a reviewer actually runs: download, unzip, launch.
      - uses: actions/upload-artifact@v4
        with:
          name: lenovo-vantage-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
